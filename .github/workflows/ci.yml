name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:17-3.5-alpine
        env:
          POSTGRES_DB: methane_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432 -U postgres -d methane_test && PGPASSWORD=postgres psql -h 127.0.0.1 -p 5432 -U postgres -d methane_test -v ON_ERROR_STOP=1 -tAc 'SELECT postgis_lib_version()'"
          --health-interval 5s
          --health-start-period 30s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:api
        env:
          CI: "true"
          TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/methane_test
      - run: bun run test:web
      - run: bun run test:verifier
      - run: bun run build:web
      - run: bun run check:web-bundle
      - run: bun run playwright install --with-deps chromium
      - run: bun run test:e2e

  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked --extra research
        working-directory: services/data-pipeline
      - run: uv run pytest
        working-directory: services/data-pipeline
      - run: uv run python evaluate_baseline.py --output /tmp/methane-response-baseline-evaluation.json
        working-directory: services/data-pipeline
      - run: cmp /tmp/methane-response-baseline-evaluation.json reports/baseline-evaluation.json
        working-directory: services/data-pipeline

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test
        working-directory: contracts
