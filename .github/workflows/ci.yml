name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  javascript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test:api
      - run: bun run test:web
      - run: bun run test:verifier
      - run: bun run build:web
      - run: bun run check:web-bundle
      - run: bun run playwright install --with-deps chromium
      - run: bun run test:e2e

  data-pipeline:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Poppler for real PDF extraction coverage
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes poppler-utils
          pdfinfo -v
          pdftotext -v
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify bounded download and source packaging tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --extra research
        working-directory: services/data-pipeline
      - run: uv run pytest
        working-directory: services/data-pipeline
      - run: uv run python evaluate_baseline.py --output /tmp/methane-response-baseline-evaluation.json
        working-directory: services/data-pipeline
      - run: cmp /tmp/methane-response-baseline-evaluation.json reports/baseline-evaluation.json
        working-directory: services/data-pipeline

  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge test
        working-directory: contracts
