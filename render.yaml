# Render native JavaScript runtime with Bun support.
services:
  - type: web
    name: methane-response-api
    runtime: node
    buildCommand: bun install --frozen-lockfile
    startCommand: cd apps/api && bun run start
    healthCheckPath: /api/health
    envVars:
      - key: BUN_VERSION
        value: 1.4.2
      - key: WEB_ORIGIN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RATE_LIMIT_HASH_SECRET
        sync: false
      - key: NODE_ENV
        value: production
